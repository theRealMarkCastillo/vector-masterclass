[project]
name = "vector-masterclass"
version = "0.1.0"
description = "Apple-Silicon-native, evidence-driven vector retrieval engineering course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3", "pandas>=2,<3", "matplotlib>=3.9,<4",
  "qdrant-client>=1.17,<1.18", "sentence-transformers>=5,<6",
  "transformers>=4.51,<5", "torch>=2.6,<3", "safetensors>=0.5",
  "huggingface-hub>=0.34,<1", "rank-bm25>=0.2.2", "scikit-learn>=1.6",
  "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "pydantic>=2.10",
  "psutil>=6", "pillow>=11", "typer>=0.15", "pyyaml>=6",
  "nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29",
  "jupyterlab>=4.3", "ipywidgets>=8.1", "networkx>=3.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[project.scripts]
vmc = "vector_masterclass.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_masterclass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: real Compose Qdrant required",
  "models: downloaded local models required",
  "slow: extended experiments and fresh notebook execution",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
